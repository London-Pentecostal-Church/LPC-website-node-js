  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar__inner">
          <p class="topbar__celebration">
            25 years of God’s faithfulness
            <span class="anniversary-years">2001 — 2026</span>
          </p>
        </div>
      </header>

      <header class="site-header" id="site-header">
        <div class="container site-header__inner">
          <a
            class="brand"
            href="#/home"
            aria-label="London Pentecostal Church home"
          >
            <img
              class="brand__logo"
              src="./assets/images/brand/lpc-logo.png"
              alt="London Pentecostal Church logo"
            />
            <span class="brand__wordmark">
              <span>London</span>
              <span>Pentecostal</span>
              <span>Church</span>
            </span>
          </a>

          <button
            class="menu-toggle"
            id="menu-toggle"
            aria-expanded="false"
            aria-controls="primary-nav"
            aria-label="Open menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <nav class="primary-nav" id="primary-nav" aria-label="Primary">
            <a href="#/home" data-nav-caption="Start here">Home</a>
            <a href="#/about" data-nav-caption="Get to know us">About</a>
            <a href="#/ministries" data-nav-caption="Find your community">Ministries</a>
            <a href="#/youth" data-nav-caption="Faith &amp; friendship">Youth</a>
            <a href="#/branches" data-nav-caption="A church near you">Branches</a>
            <a href="#/pastors" data-nav-caption="Meet our leaders">Our Ministers</a>
            <a href="#/watch" data-nav-caption="Join a service online">Watch</a>
            <a href="#/contact" data-nav-caption="We’re here to help">Contact</a>
          </nav>

          <div class="header-actions">
            <a class="btn btn--gold" href="#/plan-your-visit"
              >Plan Your Visit</a
            >
            <a class="btn btn--outline header-watch" href="#/watch"
              >Watch Sermons</a
            >
          </div>
        </div>
      </header>

      <aside style="padding:10px 20px;background:#e9f6f7;color:#17354c;text-align:center;font:14px Arial">Private test site · Demo volunteers and example service times only</aside><main id="app"></main>
    </div>

    <link rel="stylesheet" href="./assets/css/volunteers.css" />
    <script>
      // Keep account switching available if the shared external script is missing
      // or fails to load. team-auth.js replaces this fallback when it is present.
      window.LPCTeamAuth ||= Object.freeze({
        async signOut() {
          for (const path of ["/api/volunteers/logout", "/api/admin/logout"]) {
            const response = await fetch(path, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: "{}",
            });
            if (!response.ok) throw new Error("Unable to sign out. Please try again.");
          }

          const response = await fetch("/api/volunteers/session", { cache: "no-store" });
          if (!response.ok || (await response.json()).actor) {
            throw new Error("Sign-out did not complete. Please try again.");
          }
          window.location.hash = "#/volunteers";
          window.location.reload();
        },
      });
    </script>
    <script src="./assets/js/team-auth.js"></script>
    <script src="./assets/js/volunteers.js"></script>
    <script>if(!location.hash)location.hash="/volunteers";</script>
    <script src="./assets/js/site.js"></script>
  </body>
